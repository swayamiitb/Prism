[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-brain"
version = "0.1.0"
description = "Context Brain — an AI that understands how a company works and turns it into executable skills. Local models, living knowledge graph."
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "MIT" }
authors = [{ name = "Context Brain" }]
keywords = ["context-brain", "knowledge-graph", "neo4j", "ollama", "langgraph", "agent", "skills", "automation"]

# ---- Runtime dependencies (all open source) ----
dependencies = [
    # Agent orchestration + local model runtime
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.3.0",
    # Graph database
    "neo4j>=5.24.0",
    # HTTP API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    # Skills engine (YAML export) + optional web enrichment
    "PyYAML>=6.0.2",
    "httpx>=0.27.0",
    # Config & types
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # CLI
    "typer>=0.12.5",
    "rich>=13.8.0",
    # Utils
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[project.scripts]
context-brain = "context_brain.__main__:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["context_brain*", "app*"]

# ---- Ruff ----
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv*", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---- Mypy ----
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "frontend/"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["neo4j.*", "yaml.*"]
ignore_missing_imports = true

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
