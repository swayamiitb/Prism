<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="cyan2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="vio2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="grn2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="amb2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="pnk2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#db2777"/></linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="2.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="380" fill="#05060a" rx="12"/>

  <!-- LAYER 1: the question -->
  <g filter="url(#g2)">
    <rect x="400" y="24" width="200" height="44" rx="10" fill="#11141f" stroke="#475569" stroke-width="1"/>
    <text x="500" y="51" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">💬 "how do we handle X?"</text>
  </g>
  <g stroke="#475569" stroke-width="1" fill="none"><path d="M500,68 L500,88"/></g>

  <!-- LAYER 2: orchestrator -->
  <g filter="url(#g2)">
    <rect x="350" y="88" width="300" height="56" rx="12" fill="#0d1322" stroke="url(#cyan2)" stroke-width="1.5"/>
    <circle cx="378" cy="116" r="6" fill="url(#cyan2)"><animate attributeName="r" values="6;9;6" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="396" y="112" font-size="13" fill="#22d3ee" font-weight="bold">🧠 COMPANY BRAIN</text>
    <text x="396" y="128" font-size="9" fill="#64748b">LangGraph · gemma4:12b · 1 hop / turn</text>
  </g>

  <!-- fan-out to sources -->
  <g fill="none" stroke-width="1.2">
    <path d="M420,144 L150,200" stroke="#a78bfa" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.6s" repeatCount="indefinite"/></path>
    <path d="M470,144 L360,200" stroke="#fbbf24" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.7s" repeatCount="indefinite"/></path>
    <path d="M530,144 L640,200" stroke="#34d399" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.55s" repeatCount="indefinite"/></path>
  </g>

  <!-- LAYER 3: company sources -->
  <g filter="url(#g2)">
    <rect x="60" y="200" width="180" height="64" rx="10" fill="#0d1322" stroke="url(#vio2)" stroke-width="1.5"/>
    <text x="150" y="224" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold">📖 WIKI</text>
    <text x="150" y="240" font-size="8" fill="#64748b" text-anchor="middle">policies · runbooks · decisions</text>
  </g>
  <g filter="url(#g2)">
    <rect x="270" y="200" width="180" height="64" rx="10" fill="#0d1322" stroke="url(#amb2)" stroke-width="1.5"/>
    <text x="360" y="224" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="bold">💬 SLACK</text>
    <text x="360" y="240" font-size="8" fill="#64748b" text-anchor="middle">threads · "how do we handle X?"</text>
  </g>
  <g filter="url(#g2)">
    <rect x="550" y="200" width="180" height="64" rx="10" fill="#0d1322" stroke="url(#grn2)" stroke-width="1.5"/>
    <text x="640" y="224" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold">📄 DRIVE</text>
    <text x="640" y="240" font-size="8" fill="#64748b" text-anchor="middle">design docs · process docs</text>
  </g>

  <!-- synthesis path back into the brain (graph write) -->
  <g fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.6" stroke-dasharray="2 3">
    <path d="M360,264 Q260,320 200,264"/>
    <path d="M640,264 Q400,330 200,264"/>
  </g>
  <circle r="2" fill="#22d3ee"><animateMotion dur="2s" repeatCount="indefinite" path="M360,264 Q260,320 200,264"/></circle>
  <circle r="2" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.5s" path="M640,264 Q400,330 200,264"/></circle>

  <!-- LAYER 4: outputs (graph + skill file) -->
  <g filter="url(#g2)">
    <rect x="180" y="318" width="280" height="46" rx="10" fill="#0d1322" stroke="url(#cyan2)" stroke-width="1.5"/>
    <text x="320" y="346" font-size="12" fill="#22d3ee" text-anchor="middle" font-weight="bold">✦ LIVING KNOWLEDGE GRAPH (Neo4j)</text>
  </g>
  <g filter="url(#g2)">
    <rect x="540" y="318" width="280" height="46" rx="10" fill="#0d1322" stroke="url(#pnk2)" stroke-width="1.5"/>
    <text x="680" y="346" font-size="12" fill="#f472b6" text-anchor="middle" font-weight="bold">⚙️ EXECUTABLE SKILLS (.skill.yml)</text>
  </g>
  <path d="M150,264 Q200,300 320,340" stroke="#f472b6" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="3 3"/>
  <path d="M200,264 Q400,310 680,340" stroke="#f472b6" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="3 3"/>

  <text x="20" y="20" font-size="8" fill="#64748b" opacity="0.7">context-brain · how it works</text>
  <text x="980" y="20" font-size="8" fill="#64748b" opacity="0.7" text-anchor="end"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>● local · private</text>
</svg>
